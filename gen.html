<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gen Queue — Student Records</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #080b12;
      --surface: #0e1220;
      --card:    #131829;
      --border:  #1a2035;
      --accent:  #4f8eff;
      --green:   #00e5a0;
      --red:     #ff4f6e;
      --yellow:  #ffb347;
      --muted:   #4a5470;
      --text:    #c8d0e8;
      --mono:    'JetBrains Mono', monospace;
      --sans:    'Syne', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* scanline effect */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .back-link:hover { color: var(--text); border-color: var(--accent); }

    .topbar-title {
      font-weight: 800;
      font-size: 1rem;
      color: var(--text);
      flex: 1;
    }
    .topbar-title span { color: var(--accent); }

    .server-input {
      background: var(--card);
      border: 1px solid rgba(255,165,0,0.3);
      border-radius: 7px;
      padding: 7px 11px;
      color: var(--yellow);
      font-family: var(--mono);
      font-size: 0.72rem;
      outline: none;
      width: 240px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.live { background: var(--green); animation: livePulse 1.4s ease-in-out infinite; }
    @keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

    /* ── STATS BAR ── */
    .stats-bar {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      overflow-x: auto;
    }

    .stat {
      padding: 10px 22px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }
    .stat-val {
      font-family: var(--mono);
      font-size: 1.4rem;
      font-weight: 600;
      line-height: 1;
    }
    .stat-lbl { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: var(--mono); }
    .stat-val.running { color: var(--accent); }
    .stat-val.done    { color: var(--green); }
    .stat-val.failed  { color: var(--red); }
    .stat-val.queued  { color: var(--yellow); }
    .stat-val.total   { color: var(--text); }

    .stats-bar-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
    }

    /* ── CONTROLS ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 5px 13px;
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 0.72rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.13s;
    }
    .filter-btn:hover  { color: var(--text); border-color: var(--accent); }
    .filter-btn.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }

    .filter-btn.f-running.active { background: var(--accent);  border-color: var(--accent); }
    .filter-btn.f-done.active    { background: var(--green);   border-color: var(--green);  color: #0b0e17; }
    .filter-btn.f-failed.active  { background: var(--red);     border-color: var(--red); }
    .filter-btn.f-queued.active  { background: var(--yellow);  border-color: var(--yellow); color: #0b0e17; }

    .ctrl-right { margin-left: auto; display: flex; gap: 8px; }

    .act-btn {
      padding: 5px 13px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.72rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: all 0.13s;
    }
    .act-btn:hover { border-color: var(--accent); color: var(--accent); }
    .act-btn.danger:hover { border-color: var(--red); color: var(--red); }

    /* ── LOG LIST ── */
    .log-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .log-area::-webkit-scrollbar { width: 4px; }
    .log-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .log-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      gap: 10px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.8rem;
    }
    .log-empty-icon { font-size: 2.5rem; opacity: 0.2; }

    /* ── JOB CARD ── */
    .job-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    .job-card.running { border-color: rgba(79,142,255,0.35); }
    .job-card.done    { border-color: rgba(0,229,160,0.25); }
    .job-card.failed  { border-color: rgba(255,79,110,0.35); }
    .job-card.queued  { border-color: rgba(255,179,71,0.3); }

    .job-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .job-status-badge {
      font-family: var(--mono);
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .badge-queued  { background: rgba(255,179,71,0.15);  color: var(--yellow); }
    .badge-running { background: rgba(79,142,255,0.15);  color: var(--accent); animation: badgePulse 1.2s ease-in-out infinite; }
    .badge-done    { background: rgba(0,229,160,0.12);   color: var(--green); }
    .badge-failed  { background: rgba(255,79,110,0.15);  color: var(--red); }
    @keyframes badgePulse { 0%,100%{opacity:0.6} 50%{opacity:1} }

    .job-name {
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--text);
      flex: 1;
    }
    .job-folder { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
    .job-mode {
      font-family: var(--mono);
      font-size: 0.65rem;
      padding: 2px 7px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
      flex-shrink: 0;
    }

    .job-times {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .time-entry {
      display: flex;
      gap: 5px;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.68rem;
    }
    .time-lbl { color: var(--muted); }
    .time-val { color: var(--text); }

    .job-error {
      background: rgba(255,79,110,0.07);
      border: 1px solid rgba(255,79,110,0.2);
      border-radius: 6px;
      padding: 8px 12px;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--red);
      word-break: break-all;
      line-height: 1.6;
    }
    .job-error::before { content: '⚠ Error: '; font-weight: 600; }

    .job-progress {
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      overflow: hidden;
    }
    .job-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 2px;
    }
    .job-card.running  .job-progress-fill { animation: progAnim 2s ease-in-out infinite; }
    .job-card.queued   .job-progress-fill { width: 8%; background: var(--yellow); }
    .job-card.done     .job-progress-fill { width: 100%; }
    .job-card.failed   .job-progress-fill { width: 100%; background: var(--red); }
    @keyframes progAnim { 0%{width:10%} 50%{width:80%} 100%{width:10%} }

    .job-actions {
      display: flex;
      gap: 7px;
      margin-top: 2px;
    }
    .job-btn {
      padding: 4px 12px;
      border-radius: 5px;
      font-family: var(--mono);
      font-size: 0.7rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.13s;
    }
    .job-btn:hover          { border-color: var(--accent); color: var(--accent); }
    .job-btn.retry:hover    { border-color: var(--yellow); color: var(--yellow); }
    .job-btn.dismiss:hover  { border-color: var(--muted);  color: var(--muted); }

    /* ── DURATION ── */
    .duration {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 18px; right: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 15px;
      font-family: var(--mono);
      font-size: 0.75rem;
      z-index: 9999;
      transform: translateY(60px);
      opacity: 0;
      transition: all 0.26s cubic-bezier(0.34,1.56,0.64,1);
      max-width: 280px;
    }
    .toast.show    { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--red);   color: var(--red); }

    /* ── RESPONSIVE ── */
    @media(max-width:600px) {
      .topbar { padding: 0 12px; gap: 10px; }
      .server-input { width: 140px; font-size: 0.68rem; }
      .topbar-title { font-size: 0.85rem; }
      .log-area { padding: 10px 12px; }
      .stats-bar { gap: 0; }
      .stat { padding: 8px 14px; }
      .stat-val { font-size: 1.1rem; }
      .controls { padding: 8px 12px; }
    }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <a class="back-link" href="students-view.html">← Records</a>
  <div class="topbar-title">⚙️ <span>Gen</span> Queue</div>
  <div class="status-dot" id="status-dot" title="Connection status"></div>
  <input class="server-input" type="text" id="server-url"
    value="https://abc87.pythonanywhere.com"
    placeholder="https://….pythonanywhere.com"/>
</div>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="stat">
    <div class="stat-val total" id="stat-total">—</div>
    <div class="stat-lbl">Total Jobs</div>
  </div>
  <div class="stat">
    <div class="stat-val running" id="stat-running">—</div>
    <div class="stat-lbl">Running</div>
  </div>
  <div class="stat">
    <div class="stat-val queued" id="stat-queued">—</div>
    <div class="stat-lbl">Queued</div>
  </div>
  <div class="stat">
    <div class="stat-val done" id="stat-done">—</div>
    <div class="stat-lbl">Done</div>
  </div>
  <div class="stat">
    <div class="stat-val failed" id="stat-failed">—</div>
    <div class="stat-lbl">Failed</div>
  </div>
  <div class="stats-bar-actions">
    <span id="last-refresh" style="font-family:var(--mono);font-size:0.65rem;color:var(--muted);"></span>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn f-running" data-filter="running" onclick="setFilter('running',this)">⟳ Running</button>
  <button class="filter-btn f-queued"  data-filter="queued"  onclick="setFilter('queued',this)">◷ Queued</button>
  <button class="filter-btn f-done"    data-filter="done"    onclick="setFilter('done',this)">✓ Done</button>
  <button class="filter-btn f-failed"  data-filter="failed"  onclick="setFilter('failed',this)">✕ Failed</button>

  <div class="ctrl-right">
    <button class="act-btn" onclick="retryAllFailed()">🔄 Retry All Failed</button>
    <button class="act-btn danger" onclick="clearDone()">🗑 Clear Done</button>
    <button class="act-btn" onclick="manualRefresh()">↺ Refresh</button>
  </div>
</div>

<!-- LOG LIST -->
<div class="log-area" id="log-area">
  <div class="log-empty">
    <div class="log-empty-icon">🗂️</div>
    <span>Loading jobs…</span>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
function srv() { return $('server-url').value.trim().replace(/\/$/, ''); }

/* ─── TOAST ─── */
let toastT = null;
function toast(msg, type='success') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastT);
  toastT = setTimeout(() => t.className = 'toast', 3000);
}

/* ─── FILTER ─── */
let currentFilter = 'all';
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderJobs(_lastJobs);
}

/* ─── STATE ─── */
let _lastJobs  = {};
let _pollTimer = null;

/* ─── POLL ─── */
function startPoll() {
  if (_pollTimer) return;
  _pollTimer = setInterval(fetchJobs, 2500);
  fetchJobs();
}

async function fetchJobs() {
  const dot = $('status-dot');
  try {
    const res  = await fetch(`${srv()}/gen-status`);
    if (!res.ok) throw new Error();
    _lastJobs = await res.json();
    dot.className = 'status-dot live';
    $('last-refresh').textContent = 'updated ' + new Date().toLocaleTimeString();
    renderJobs(_lastJobs);
  } catch(_) {
    dot.className = 'status-dot';
  }
}

function manualRefresh() { fetchJobs(); }

/* ─── RENDER ─── */
function renderJobs(jobs) {
  const area   = $('log-area');
  let entries  = Object.values(jobs);

  // Sort: running first, then queued, then failed, then done; within each newest first
  const order = { running:0, queued:1, failed:2, done:3 };
  entries.sort((a,b) => {
    if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
    return (b.queued_at||'').localeCompare(a.queued_at||'');
  });

  if (currentFilter !== 'all') entries = entries.filter(j => j.status === currentFilter);

  // Update stats
  const all = Object.values(jobs);
  $('stat-total').textContent   = all.length;
  $('stat-running').textContent = all.filter(j=>j.status==='running').length;
  $('stat-queued').textContent  = all.filter(j=>j.status==='queued').length;
  $('stat-done').textContent    = all.filter(j=>j.status==='done').length;
  $('stat-failed').textContent  = all.filter(j=>j.status==='failed').length;

  if (!entries.length) {
    area.innerHTML = `<div class="log-empty"><div class="log-empty-icon">${currentFilter==='all'?'📭':'🔍'}</div><span>${currentFilter==='all'?'No jobs yet.':'No '+currentFilter+' jobs.'}</span></div>`;
    return;
  }

  area.innerHTML = entries.map(j => jobCard(j)).join('');
}

function jobCard(j) {
  const duration = calcDuration(j);
  return `
  <div class="job-card ${j.status}" id="jc_${j.job_id}">
    <div class="job-progress"><div class="job-progress-fill"></div></div>
    <div class="job-top">
      <span class="job-status-badge badge-${j.status}">${statusLabel(j.status)}</span>
      <span class="job-name">👤 ${esc(j.student_name || j.folder)}</span>
      <span class="job-folder">${esc(j.folder)}</span>
      <span class="job-mode">${j.mode || 'normal'}</span>
      ${duration ? `<span class="duration">${duration}</span>` : ''}
    </div>
    <div class="job-times">
      ${j.queued_at   ? `<div class="time-entry"><span class="time-lbl">queued</span><span class="time-val">${fmtTime(j.queued_at)}</span></div>` : ''}
      ${j.started_at  ? `<div class="time-entry"><span class="time-lbl">started</span><span class="time-val">${fmtTime(j.started_at)}</span></div>` : ''}
      ${j.finished_at ? `<div class="time-entry"><span class="time-lbl">finished</span><span class="time-val">${fmtTime(j.finished_at)}</span></div>` : ''}
    </div>
    ${j.error ? `<div class="job-error">${esc(j.error)}</div>` : ''}
    <div class="job-actions">
      ${j.status === 'failed' ? `<button class="job-btn retry" onclick="retryJob('${j.job_id}')">🔄 Retry</button>` : ''}
      ${j.status === 'done'   ? `<button class="job-btn dismiss" onclick="dismissJob('${j.job_id}')">✕ Dismiss</button>` : ''}
      <button class="job-btn" onclick="copyJobId('${j.job_id}')">📋 ID</button>
    </div>
  </div>`;
}

function statusLabel(s) {
  return { queued:'◷ Queued', running:'⟳ Running', done:'✓ Done', failed:'✕ Failed' }[s] || s;
}

function esc(v) { return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtTime(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  } catch(_) { return iso; }
}

function calcDuration(j) {
  const s = j.started_at  ? new Date(j.started_at).getTime()  : null;
  const e = j.finished_at ? new Date(j.finished_at).getTime() : (j.status==='running'?Date.now():null);
  if (!s || !e) return '';
  const sec = Math.round((e - s) / 1000);
  if (sec < 60) return `${sec}s`;
  return `${Math.floor(sec/60)}m ${sec%60}s`;
}

/* ─── ACTIONS ─── */
async function retryJob(jobId) {
  try {
    const res = await fetch(`${srv()}/gen-retry`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_id: jobId })
    });
    const r = await res.json();
    r.success ? toast('🔄 Retrying job…') : toast('❌ ' + (r.error||'Failed'), 'error');
    fetchJobs();
  } catch(e) { toast('❌ '+e.message,'error'); }
}

async function retryAllFailed() {
  const failed = Object.values(_lastJobs).filter(j => j.status === 'failed');
  if (!failed.length) { toast('No failed jobs to retry.'); return; }
  for (const j of failed) await retryJob(j.job_id);
}

async function clearDone() {
  // Client-side: remove done jobs from view (server keeps gen.json intact unless we add a clear route)
  // Minimal approach: reload and they stay. Better: call a clear-done endpoint.
  try {
    const res = await fetch(`${srv()}/gen-clear-done`, { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    const r   = await res.json();
    if (r.success) { toast('🗑 Done jobs cleared.'); fetchJobs(); }
    else toast('❌ '+(r.error||''), 'error');
  } catch(_) {
    // fallback: just hide done entries locally
    Object.keys(_lastJobs).forEach(k => { if (_lastJobs[k].status === 'done') delete _lastJobs[k]; });
    renderJobs(_lastJobs);
    toast('Done jobs hidden (local only).');
  }
}

function dismissJob(jobId) {
  delete _lastJobs[jobId];
  renderJobs(_lastJobs);
}

function copyJobId(id) {
  navigator.clipboard.writeText(id).then(
    () => toast('📋 Job ID copied!'),
    () => toast('Could not copy.','error')
  );
}

/* ─── INIT ─── */
$('server-url').addEventListener('change', () => { fetchJobs(); });
startPoll();
</script>
</body>
</html>
